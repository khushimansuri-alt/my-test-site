media:
  input: src/img
  output: /img

content:
  - name: pages
    label: Pages
    type: file
    path: src/index.md
    fields:
      - name: title
        label: Page Title
        type: string
      - name: body
        label: Page Content
        type: rich-text

  - name: blog
    label: Blog Posts
    type: collection
    path: src/blog
    filter:
      path: src/blog/*.md
    fields:
      - name: title
        label: Post Title
        type: string
      - name: date
        label: Publish Date
        type: date
      - name: body
        label: Article Content
        type: rich-text
